services:
# 1. TimescaleDB + PostgreSQL (Optimized for Time-Series)
    timescaledb:
        image: timescale/timescaledb:latest-pg17
        container_name: opan-timescaledb
        environment:
            - POSTGRES_PASSWORD=${POSTGRES_ADMIN_PASSWORD}
            - POSTGRES_USER=admin
            - POSTGRES_DB=${PGSQL_TIMESCALEDB}
            - TIMESCALEDB_TELEMETRY=off
        ports:
            - "5433:5432" # Hosted on 5433 to avoid conflict with standard Postgres
        volumes:
            - timescaledb_data:/var/lib/postgresql/data
        restart: always

    # 2. Redis (Cache Broker)
    redis:
        image: redis:7.4-alpine
        container_name: opan-redis
        command: redis-server --save 60 1 --loglevel warning
        ports:
            - "6379:6379"
        volumes:
            - redis_data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5
        restart: always

volumes:
    timescaledb_data:
    redis_data:
